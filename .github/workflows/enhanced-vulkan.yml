name: enhanced-vulkan
on:
  workflow_dispatch:
  push:
    paths:
      - 'enhanced/**'
      - 'cmake/BTBTargets.cmake'
      - 'runtime/win32_original_imports3.cpp'
      - 'include/btb/win32_frame_output.hpp'
      - 'include/btb/packed_frame_snapshot.hpp'
      - 'include/btb/opaque_global_video.hpp'
      - 'include/btb/frame_composition_layer.hpp'
      - 'include/btb/native_movie_pixels.hpp'
      - 'include/btb/packed_scene.hpp'
      - 'runtime/win32_original_game_device.cpp'
      - 'runtime/win32_retail_print_provider.cpp'
      - 'include/btb/win32_native_movie_surface.hpp'
      - 'runtime/win32_native_silent_bink_provider.cpp'
      - 'runtime/win32_native_spud_skate_movies.cpp'
      - 'runtime/win32_native_fireworks_movie_bank.cpp'
      - 'runtime/win32_recompiled_host.cpp'
      - 'runtime/win32_original_directdraw.cpp'
      - '.github/workflows/enhanced-vulkan.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vulkan-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate original function registries
        run: |
          python tools/build_reconstruction_index.py
          python tools/build_remaining_architecture.py
      - name: Install verified LunarG Vulkan SDK 1.4.341.1
        shell: pwsh
        run: |
          $version = "1.4.341.1"
          $root = "C:\VulkanSDK\$version"
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-X64-$version.exe"
          $expected = "bcf2d75aa9556889ab974858666e20b3655b6055a0db704ccb47279ff33b5bfe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "SDK installer SHA256 mismatch" }
          $proc = Start-Process -FilePath $installer -ArgumentList @("--root",$root,"--accept-licenses","--default-answer","--confirm-command","install") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Vulkan SDK installer exit $($proc.ExitCode)" }
          if (!(Test-Path "$root\Include\vulkan\vulkan.h") -or !(Test-Path "$root\Bin\slangc.exe")) { throw "Required Vulkan headers or Slang compiler missing" }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH
      - name: Configure required Vulkan and Slang
        run: cmake -S . -B build/enhanced-vulkan -G "Visual Studio 18 2026" -A x64 -DBTB_BUILD_ENHANCED=ON -DBTB_REQUIRE_VULKAN=ON -DBTB_REQUIRE_SLANG=ON
      - name: Build enhanced executable, shaders, policy and Vulkan smoke
        run: cmake --build build/enhanced-vulkan --config Release --target btb_game_enhanced btb_enhanced_policy_tests btb_enhanced_frame_pacing_tests btb_enhanced_presentation_activity_tests btb_enhanced_native_cursor_plan_tests btb_enhanced_sprite_motion_tests btb_enhanced_packed_layer_tests btb_enhanced_native_movie_pixels_tests btb_enhanced_packed_scene_tests btb_enhanced_win32_packed_tests btb_enhanced_sprite_batch_tests btb_enhanced_vulkan_tests btb_enhanced_vulkan_sprite_tests
      - name: Prove enhanced executable has no DirectDraw imports
        shell: pwsh
        run: |
          python enhanced/check_pe_imports_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem build/enhanced-vulkan -Recurse -Filter btb_game_enhanced.exe | Select-Object -First 1
          if (!$exe) { throw "Enhanced executable missing" }
          python enhanced/check_pe_imports.py $exe.FullName --forbid ddraw.dll --require vulkan-1.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = Get-ChildItem build/enhanced-vulkan -Recurse -Filter btb_enhanced_win32_packed_tests.exe | Select-Object -First 1
          if (!$probe) { throw "Packed integration probe missing" }
          python enhanced/check_pe_imports.py $probe.FullName --forbid ddraw.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate compiled SPIR-V
        shell: pwsh
        run: |
          $shaders = @(Get-ChildItem build/enhanced-vulkan -Recurse -Filter *.spv)
          if ($shaders.Count -lt 5) { throw "Expected all five compiled Slang entrypoints" }
          foreach ($shader in $shaders) {
            & spirv-val --target-env vulkan1.4 $shader.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Export exact compiled compute shaders for headless Vulkan tests
        uses: actions/upload-artifact@v4
        with:
          name: btb-compute-spirv
          path: |
            build/enhanced-vulkan/shaders/spriteBatch.spv
            build/enhanced-vulkan/shaders/binkOpaque.spv
          if-no-files-found: error
      - name: Run enhanced policy, source-link and actual Vulkan presentation smoke
        run: ctest --test-dir build/enhanced-vulkan -C Release --output-on-failure -R "^enhanced_"
      - uses: actions/upload-artifact@v4
        with:
          name: btb-enhanced-vulkan-x64
          path: |
            build/enhanced-vulkan/**/btb_game_enhanced.exe
            build/enhanced-vulkan/**/btb_enhanced_vulkan_tests.exe
            build/enhanced-vulkan/**/btb_enhanced_vulkan_sprite_tests.exe
            build/enhanced-vulkan/**/*.spv
            enhanced/Launch.cmd
            enhanced/Launch-GPU.cmd
          if-no-files-found: error

  compute-lavapipe:
    needs: vulkan-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: btb-compute-spirv
          path: build/compute-shaders
      - name: Install Mesa Vulkan software driver and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libvulkan-dev mesa-vulkan-drivers vulkan-tools spirv-tools
      - name: Build exact compute differential on Linux
        run: |
          mkdir -p build/compute-tests
          g++-14 -std=c++2c -O2 -Iinclude enhanced/vulkan_sprite_batch_test.cpp enhanced/vulkan_sprite_batch.cpp src/bink32_surface_convert.cpp -lvulkan -o build/compute-tests/compute-differential
      - name: Require actual SPIR-V execution on Lavapipe
        run: |
          set -e
          test -f build/compute-shaders/spriteBatch.spv
          test -f build/compute-shaders/binkOpaque.spv
          spirv-val --target-env vulkan1.2 build/compute-shaders/spriteBatch.spv
          spirv-val --target-env vulkan1.2 build/compute-shaders/binkOpaque.spv
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          # Unlike Windows hosted hardware smoke, a missing driver/skip
          # is a failure here. Mesa software execution is mandatory.
          build/compute-tests/compute-differential build/compute-shaders

name: repo-checks

# Compile only the newest commit on each branch. Bulk reconstruction pushes
# otherwise launch several competing x86/x64/Linux compilers unnecessarily.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tooling
        run: python -m py_compile tools/*.py


  reconstruction-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate evidence-indexed original-function registry
        run: python tools/build_reconstruction_index.py
      - name: Generate the unified 615-function architecture registry
        run: python tools/build_remaining_architecture.py
      - name: Install C++26 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
      - name: Configure reconstruction
        env:
          CXX: g++-14
        run: cmake -S reconstruction -B build/reconstruction
      - name: Build reconstruction
        run: cmake --build build/reconstruction --parallel
      - name: Test reconstruction
        run: ctest --test-dir build/reconstruction --output-on-failure

  integrated-game-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate evidence-indexed original-function registry
        run: python tools/build_reconstruction_index.py
      - name: Generate unified architecture evidence
        run: python tools/build_remaining_architecture.py
      - name: Configure C++26 Windows game
        run: cmake -S reconstruction -B build/reconstruction-win -G "Visual Studio 18 2026" -A x64
      - name: Build game and integrated regression
        run: cmake --build build/reconstruction-win --config Release --target btb_game btb_full_game_fireworks_transition_tests btb_game_session_tests btb_original_win32_platform_link_tests btb_original_leaf_batch_25_tests btb_original_game_batch_13_tests btb_original_crt_batch_32_tests btb_original_games_batch_14_tests btb_original_msvc30_tests btb_native_input_pulse_tests btb_native_host_input_tests btb_original_crt17_tests btb_original_runtime5_tests btb_original_active_frame_tests btb_original_runtime8_tests btb_original_crt10_tests btb_full_game_native_session_source_tests btb_original_media15_tests btb_original_system14_tests btb_original_activity9_tests btb_original_lifecycle12_tests btb_original_shared11_tests btb_original_gameplay11_tests btb_original_live_maze_debounce_tests btb_original_gameplay9_tests btb_original_source9_tests btb_original_gameplay6_tests btb_original_services8_tests btb_original_shared_ui8_tests btb_original_crt9_tests btb_profile_name_entry_tests btb_full_game_profiles_source_tests btb_bobs_band_source_tests btb_original_profile_screen_tests btb_original_runtime16_tests btb_original_string8_tests btb_retail_pure_runtime_vectors_tests btb_original_float6_tests btb_original_exception9_tests btb_original_startup11_tests btb_original_help2_tests btb_original_editor3_tests btb_original_runtime15_tests btb_original_locale7_tests btb_original_wave7_tests btb_original_printer7_tests btb_original_runtime6_tests btb_original_batch13_tests btb_original_io13_tests btb_original_heap14_tests btb_original_unwind15_tests btb_original_cxx12_tests btb_original_device8_tests btb_original_tail4_tests btb_original_closure8_tests btb_original_input_crt8_tests btb_original_gameplay3_tests btb_original_fireworks_start2_tests btb_original_maze_init2_tests btb_original_profiles_fireworks2_tests btb_original_draw4_tests btb_original_activity4_tests btb_original_motion4_tests btb_original_coordinators2_tests btb_original_gameplay3b_tests btb_original_init2_tests btb_original_herding_init_tests btb_original_park_init_tests btb_original_crt_float3_tests btb_original_closure4_tests btb_original_stdio2_tests btb_original_last2_tests --parallel
      - name: Verify reconstructed profile flow and music regression on Windows
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^(profile_name_entry|full_game_profiles_source|bobs_band_source|original_profile_screen|original_runtime16|original_string8|retail_pure_runtime_vectors|original_float6|original_exception9|original_startup11|original_help2|original_editor3|original_runtime15|original_locale7|original_wave7|original_printer7|original_runtime6|original_batch13|original_io13|original_heap14|original_unwind15|original_cxx12|original_device8|original_tail4|original_closure8|original_input_crt8|original_gameplay3|original_fireworks_start2|original_maze_init2|original_profiles_fireworks2|original_draw4|original_activity4|original_motion4|original_coordinators2|original_gameplay3b|original_init2|original_herding_init|original_park_init|original_crt_float3|original_closure4|original_stdio2|original_last2)$"
      - name: Verify integrated session on Windows
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^game_session$"
      - name: Verify original DirectDraw7 DirectSound8 and Bink loader linkage
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_win32_platform_link$"
      - name: Execute all 25 original leaf C++ bodies on x64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_leaf_batch_25$"
      - name: Verify 13 compiled original gameplay helpers in Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_game_batch_13$"
      - name: Execute 32 native MSVC runtime originals on Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_crt_batch_32$"
      - name: Exercise 14 native gameplay routines on Windows x64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_games_batch_14$"
      - name: Verify 30 original MSVC functions on Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_msvc30$"
      - name: Execute actual Win64 game-core smoke through btb_game.exe
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^recompiled_game_executable_link$"
      - name: Verify native game click-pulse parity Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^native_input_pulse$"
      - name: Verify 17 original CRT routines on Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_crt17$"
      - name: Verify five original native CRT dependencies Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_runtime5$"
      - name: Verify original game frame state-machine Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_active_frame$"
      - name: Test original environment locale and sorting on Windows x64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_runtime8$"
      - name: Verify 10 original CRT file and heap functions Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_crt10$"
      - name: Validate source Fireworks pre-show Bink routing in Windows Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^full_game_fireworks_transition$"
      - name: Execute native two-phase session regression Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^full_game_native_session_source$"
      - name: Exercise 15 original media and Bink game functions Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_media15$"
      - name: Verify 14 original native resource destructors Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_system14$"
      - name: Execute nine native gameplay and Bink-source functions Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_activity9$"
      - name: Verify 12 original activity lifecycle functions Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_lifecycle12$"
      - name: Verify shared original device functions on Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_shared11$"
      - name: Verify 11 original Golf Squirrel Band loaders Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_gameplay11$"
      - name: Verify live Maze calls compiled 0041AEB0 Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_live_maze_debounce$"
      - name: Verify nine original gameplay and Bink functions Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_gameplay9$"
      - name: Exercise original Park Designer and Spud algorithms Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_source9$"
      - name: Verify six original Golf Spud Skate Fireworks and Band routines Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_gameplay6$"
      - name: Verify 8 native original platform services Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_services8$"
      - name: Test 8 recovered shared UI routines in Windows x64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_shared_ui8$"
      - name: Validate nine native CRT procedures Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_crt9$"
      - name: Upload source-only preview EXE
        uses: actions/upload-artifact@v4
        with:
          name: btb-game-win64-preview
          path: build/reconstruction-win/Release/btb_game.exe
          if-no-files-found: error



name: repo-checks

# Compile only the newest commit on each branch. Bulk reconstruction pushes
# otherwise launch several competing x86/x64/Linux compilers unnecessarily.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tooling
        run: python -m py_compile tools/*.py


  reconstruction-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate evidence-indexed original-function registry
        run: python tools/build_reconstruction_index.py
      - name: Generate the unified 615-function architecture registry
        run: python tools/build_remaining_architecture.py
      - name: Install C++26 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
      - name: Configure reconstruction
        env:
          CXX: g++-14
        run: cmake -S reconstruction -B build/reconstruction
      - name: Build reconstruction
        run: cmake --build build/reconstruction --parallel
      - name: Test reconstruction
        run: ctest --test-dir build/reconstruction --output-on-failure

  integrated-game-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate evidence-indexed original-function registry
        run: python tools/build_reconstruction_index.py
      - name: Generate unified architecture evidence
        run: python tools/build_remaining_architecture.py
      - name: Configure C++26 Windows game
        run: cmake -S reconstruction -B build/reconstruction-win -G "Visual Studio 18 2026" -A x64
      - name: Build game and integrated regression
        run: cmake --build build/reconstruction-win --config Release --target btb_game btb_game_session_tests btb_original_win32_platform_link_tests btb_original_leaf_batch_25_tests btb_original_game_batch_13_tests btb_original_crt_batch_32_tests btb_original_games_batch_14_tests btb_original_msvc30_tests btb_native_input_pulse_tests btb_original_crt17_tests btb_original_runtime5_tests btb_original_active_frame_tests btb_original_runtime8_tests btb_original_crt10_tests btb_full_game_native_session_source_tests btb_original_media15_tests btb_original_system14_tests btb_original_activity9_tests --parallel
      - name: Verify integrated session on Windows
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^game_session$"
      - name: Verify original DirectDraw7 DirectSound8 and Bink loader linkage
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_win32_platform_link$"
      - name: Execute all 25 original leaf C++ bodies on x64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_leaf_batch_25$"
      - name: Verify 13 compiled original gameplay helpers in Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_game_batch_13$"
      - name: Execute 32 native MSVC runtime originals on Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_crt_batch_32$"
      - name: Exercise 14 native gameplay routines on Windows x64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_games_batch_14$"
      - name: Verify 30 original MSVC functions on Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_msvc30$"
      - name: Execute actual Win64 game-core smoke through btb_game.exe
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^recompiled_game_executable_link$"
      - name: Verify native game click-pulse parity Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^native_input_pulse$"
      - name: Verify 17 original CRT routines on Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_crt17$"
      - name: Verify five original native CRT dependencies Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_runtime5$"
      - name: Verify original game frame state-machine Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_active_frame$"
      - name: Test original environment locale and sorting on Windows x64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_runtime8$"
      - name: Verify 10 original CRT file and heap functions Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_crt10$"
      - name: Execute native two-phase session regression Win64 Release
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^full_game_native_session_source$"
      - name: Exercise 15 original media and Bink game functions Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_media15$"
      - name: Verify 14 original native resource destructors Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_system14$"
      - name: Execute nine native gameplay and Bink-source functions Win64
        run: ctest --test-dir build/reconstruction-win -C Release --output-on-failure -R "^original_activity9$"
      - name: Upload source-only preview EXE
        uses: actions/upload-artifact@v4
        with:
          name: btb-game-win64-preview
          path: build/reconstruction-win/Release/btb_game.exe
          if-no-files-found: error


  integrated-game-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate original function registry
        run: python tools/build_reconstruction_index.py
      - name: Generate 615-function architecture evidence
        run: python tools/build_remaining_architecture.py
      - name: Configure original 32-bit Windows executable
        run: cmake -S reconstruction -B build/reconstruction-x86 -G "Visual Studio 18 2026" -A Win32
      - name: Build x86 game and real Win32 COM providers
        run: cmake --build build/reconstruction-x86 --config Release --target btb_game btb_original_win32_platform_link_tests btb_original_leaf_batch_25_tests btb_original_game_batch_13_tests btb_original_crt_batch_32_tests btb_original_games_batch_14_tests btb_original_msvc30_tests btb_native_input_pulse_tests btb_original_crt17_tests btb_original_runtime5_tests btb_original_active_frame_tests btb_original_runtime8_tests btb_original_crt10_tests btb_full_game_native_session_source_tests btb_original_media15_tests btb_original_system14_tests btb_original_activity9_tests --parallel
      - name: Verify x86 native graphics/audio/Bink provider linkage
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_win32_platform_link$"
      - name: Execute all 25 original leaf C++ bodies on x86 Release
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_leaf_batch_25$"
      - name: Verify 13 compiled original gameplay helpers in Win32 Release
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_game_batch_13$"
      - name: Execute 32 native MSVC runtime originals on Win32 Release
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_crt_batch_32$"
      - name: Exercise 14 native gameplay routines on Windows x86 Release
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_games_batch_14$"
      - name: Verify 30 original MSVC functions on Win32 Release
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_msvc30$"
      - name: Execute actual Win32 x86 game-core smoke through btb_game.exe
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^recompiled_game_executable_link$"
      - name: Verify native game click-pulse parity Win32 Release
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^native_input_pulse$"
      - name: Verify 17 original CRT routines on Win32 Release
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_crt17$"
      - name: Verify five original native CRT dependencies Win32 Release
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_runtime5$"
      - name: Verify original game frame state-machine Win32 x86 Release
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_active_frame$"
      - name: Test original environment locale and sorting on Win32 x86
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_runtime8$"
      - name: Verify 10 original CRT file and heap functions Win32 Release
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_crt10$"
      - name: Execute native two-phase session regression Win32 x86 Release
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^full_game_native_session_source$"
      - name: Exercise 15 original media and Bink game functions Win32
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_media15$"
      - name: Verify 14 original native resource destructors Win32
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_system14$"
      - name: Execute nine native gameplay and Bink-source functions Win32
        run: ctest --test-dir build/reconstruction-x86 -C Release --output-on-failure -R "^original_activity9$"
      - name: Upload actual x86 compiled game image
        uses: actions/upload-artifact@v4
        with:
          name: btb-game-win32-x86-link-preview
          path: build/reconstruction-x86/Release/btb_game.exe
          if-no-files-found: error
